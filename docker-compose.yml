version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: retailflow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: retail_inventory_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - retailflow-network

  backend:
    build:
      context: ./RetailManagement
      dockerfile: Dockerfile
    container_name: retailflow-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/retail_inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:4200,http://frontend:80
    networks:
      - retailflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailflow-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "4200:80"
    networks:
      - retailflow-network

networks:
  retailflow-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
