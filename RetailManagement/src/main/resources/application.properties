# Server port (Render sets PORT dynamically; defaults to 8080 locally)
server.port=${PORT:8080}

# Database configuration (environment variables take precedence, with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/retail_inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:A@yushi2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://*.onrender.com}